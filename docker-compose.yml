services:
  app:
    build: .
    container_name: todo-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/todoapp
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: todo-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
